# UPSTREAM GoMud HOLDOVER. NOT LOADED BY DOGMud.
#
# The live combat-message store is _datafiles/world/dogmud/combat-messages.
# This tree is upstream content kept for merge tracking only: main.go passes
# it to util.ValidateWorldFiles, which compares top-level DIRECTORY NAMES and
# never opens a file.
#
# It could not load if it were pointed at. These files put a flat list under
# each role, while the schema expects beginner/expert/master tiers, and none
# of them defines the `fumble` intensity that Validate() requires. The wider
# tree is missing 30+ subsystems the engine loads unconditionally, so a boot
# against it would die long before it reached this directory.
#
# Do not edit these to match dogmud. See
# docs/superpowers/specs/completed/2026-09-16-messaging-m3-item8-combat-messages-design.md
# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: shooting
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You ready your <ansi fg="item">{itemname}</ansi> against <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You take aim at <ansi fg="{acteetype}">{actee}</ansi>, preparing to attack.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> levels their <ansi fg="item">{itemname}</ansi> at you, eyes filled with intent.'
      - '<ansi fg="{actortype}">{actor}</ansi> takes aim at you with their <ansi fg="item">{itemname}</ansi>.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> against <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> takes aim at <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You prepare to attack <ansi fg="{acteetype}">{actee}</ansi> through the <ansi fg="exit">{exitname}</ansi> direction.'
      - 'You ready your <ansi fg="item">{itemname}</ansi>, aiming towards the <ansi fg="exit">{exitname}</ansi> direction at <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You take position to shoot at <ansi fg="{acteetype}">{actee}</ansi> through the <ansi fg="exit">{exitname}</ansi>.'
      todefender:
      - 'Someone... or something, is aiming at you from the <ansi fg="exit">{entrancename}</ansi> direction.'
      - 'You sense danger coming from the <ansi fg="exit">{entrancename}</ansi> direction.'
      - 'A feeling of being watched comes from the <ansi fg="exit">{entrancename}</ansi> direction.'
      toattackerroom:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to attack towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> aiming towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '<ansi fg="{actortype}">{actor}</ansi> takes aim through the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
