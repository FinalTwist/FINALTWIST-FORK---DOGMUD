# UPSTREAM GoMud HOLDOVER. NOT LOADED BY DOGMud.
#
# The live combat-message store is _datafiles/world/dogmud/combat-messages.
# This tree is upstream content kept for merge tracking only: main.go passes
# it to util.ValidateWorldFiles, which compares top-level DIRECTORY NAMES and
# never opens a file.
#
# It could not load if it were pointed at. These files put a flat list under
# each role, while the schema expects beginner/expert/master tiers, and none
# of them defines the `fumble` intensity that Validate() requires. The wider
# tree is missing 30+ subsystems the engine loads unconditionally, so a boot
# against it would die long before it reached this directory.
#
# Do not edit these to match dogmud. See
# docs/superpowers/specs/completed/2026-09-16-messaging-m3-item8-combat-messages-design.md
# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: slashing
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You grip your <ansi fg="item">{itemname}</ansi> tightly, readying yourself against <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You lock eyes with <ansi fg="{acteetype}">{actee}</ansi>, your <ansi fg="item">{itemname}</ansi> poised to strike.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi> menacingly at you.'
      - '<ansi fg="{actortype}">{actor}</ansi> glares at you, <ansi fg="item">{itemname}</ansi> at the ready.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, facing off against <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> locks eyes with <ansi fg="{acteetype}">{actee}</ansi>, weapon ready to strike.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You circle around <ansi fg="{acteetype}">{actee}</ansi>, looking for an opening.'
      - 'You watch <ansi fg="{acteetype}">{actee}</ansi> closely, waiting for the perfect moment.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> circles dangerously.'
      - '<ansi fg="{actortype}">{actor}</ansi> watches you intently, waiting to strike.'
      - '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> steady, eyes fixed on you.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with cruel intentions.'
      - '<ansi fg="{actortype}">{actor}</ansi> stalks around <ansi fg="{acteetype}">{actee}</ansi>, awaiting an opportunity.'
      - '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi> warily, ready to strike.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You wave your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, to no avail!'
      - 'Your swing at <ansi fg="{acteetype}">{actee}</ansi> misses completely!'
      - 'You slash at <ansi fg="{acteetype}">{actee}</ansi> but fail to connect!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> waves their <ansi fg="item">{itemname}</ansi> at you, but does nothing.'
      - '<ansi fg="{actortype}">{actor}</ansi> swings their <ansi fg="item">{itemname}</ansi> wildly, missing you entirely.'
      - '<ansi fg="{actortype}">{actor}</ansi> attempts to slash you but misses!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> waves their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, but does nothing.'
      - '<ansi fg="{actortype}">{actor}</ansi> swings at <ansi fg="{acteetype}">{actee}</ansi> but misses completely.'
      - '<ansi fg="{actortype}">{actor}</ansi> attempts to slash <ansi fg="{acteetype}">{actee}</ansi> but fails to connect.'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You slice at <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi> causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your <ansi fg="item">{itemname}</ansi> grazes <ansi fg="{acteetype}">{actee}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You land a minor cut on <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> slices you with their <ansi fg="item">{itemname}</ansi> causing <ansi fg="damage">{damage} damage</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> grazes you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You feel a minor cut as <ansi fg="{actortype}">{actor}</ansi> strikes you for <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> slices at <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> grazes <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a minor cut on <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You connect with your <ansi fg="item">{itemname}</ansi>, wounding <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You slash <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> cuts into <ansi fg="{acteetype}">{actee}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> connects with their <ansi fg="item">{itemname}</ansi>, wounding you for <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> slashes you with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You feel a sharp pain as <ansi fg="{actortype}">{actor}</ansi> cuts you for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> connects with their <ansi fg="item">{itemname}</ansi>, wounding <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> slashes <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> cuts into <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'In a sweeping motion, you slash <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>, doing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a powerful blow to <ansi fg="{acteetype}">{actee}</ansi>, causing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> cuts deeply into <ansi fg="{acteetype}">{actee}</ansi>, dealing significant damage of <ansi fg="damage">{damage}</ansi>!'
      todefender:
      - 'In a sweeping motion, <ansi fg="{actortype}">{actor}</ansi> slashes you with their <ansi fg="item">{itemname}</ansi>, doing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a powerful blow, causing you <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit hard as <ansi fg="{actortype}">{actor}</ansi> cuts deeply into you for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - 'In a sweeping motion, <ansi fg="{actortype}">{actor}</ansi> slashes <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a powerful blow to <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> cuts deeply into <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY LACERATES</ansi> <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi> to <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">TEARS THROUGH</ansi> <ansi fg="{acteetype}">{actee}</ansi>, dealing a devastating <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY LACERATES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi>, causing you <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">DEVASTATED</ansi> by <ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY LACERATES</ansi> <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi> to <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> <ansi fg="cyan-bold">DEVASTATES</ansi> <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
