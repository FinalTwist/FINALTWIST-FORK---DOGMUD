# UPSTREAM GoMud HOLDOVER. NOT LOADED BY DOGMud.
#
# The live combat-message store is _datafiles/world/dogmud/combat-messages.
# This tree is upstream content kept for merge tracking only: main.go passes
# it to util.ValidateWorldFiles, which compares top-level DIRECTORY NAMES and
# never opens a file.
#
# It could not load if it were pointed at. These files put a flat list under
# each role, while the schema expects beginner/expert/master tiers, and none
# of them defines the `fumble` intensity that Validate() requires. The wider
# tree is missing 30+ subsystems the engine loads unconditionally, so a boot
# against it would die long before it reached this directory.
#
# Do not edit these to match dogmud. See
# docs/superpowers/specs/2026-09-16-messaging-m3-item8-combat-messages-design.md
# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: cleaving
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You grip your <ansi fg="item">{itemname}</ansi> tightly, eyeing <ansi fg="{acteetype}">{actee}</ansi> for battle.'
      - 'You ready your <ansi fg="item">{itemname}</ansi>, preparing to cleave <ansi fg="{acteetype}">{actee}</ansi>.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> hefts their <ansi fg="item">{itemname}</ansi>, eyeing you menacingly.'
      - '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> and focuses on you.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, preparing to engage <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi>, eyes fixed on <ansi fg="{acteetype}">{actee}</ansi>.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You circle around <ansi fg="{acteetype}">{actee}</ansi>, looking for an opening.'
      - 'You watch <ansi fg="{acteetype}">{actee}</ansi> closely, waiting for the perfect moment to strike.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> circles dangerously.'
      - '<ansi fg="{actortype}">{actor}</ansi> watches you intently, their <ansi fg="item">{itemname}</ansi> at the ready.'
      - '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> steady, eyeing you carefully.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with cruel intentions.'
      - '<ansi fg="{actortype}">{actor}</ansi> stalks around <ansi fg="{acteetype}">{actee}</ansi>, awaiting an opportunity.'
      - '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi> warily, ready to cleave.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You heave your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, but they easily dodge!'
      - 'Your swing at <ansi fg="{acteetype}">{actee}</ansi> misses completely!'
      - 'You attempt to cleave <ansi fg="{acteetype}">{actee}</ansi>, but fail to connect!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> heaves <ansi fg="item">{itemname}</ansi> at you, but you easily dodge!'
      - '<ansi fg="{actortype}">{actor}</ansi> swings their <ansi fg="item">{itemname}</ansi> wildly, missing you entirely.'
      - '<ansi fg="{actortype}">{actor}</ansi> tries to cleave you but misses!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> heaves <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, but they easily dodge!'
      - '<ansi fg="{actortype}">{actor}</ansi> swings at <ansi fg="{acteetype}">{actee}</ansi> but misses completely.'
      - '<ansi fg="{actortype}">{actor}</ansi> attempts to cleave <ansi fg="{acteetype}">{actee}</ansi> but fails to connect!'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You heave your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, but it bounces off for <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your <ansi fg="item">{itemname}</ansi> barely scratches <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You land a weak blow on <ansi fg="{acteetype}">{actee}</ansi>, dealing only <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> heaves their <ansi fg="item">{itemname}</ansi> but does barely <ansi fg="damage">{damage} damage</ansi> to you.'
      - 'You feel a light impact as <ansi fg="{actortype}">{actor}</ansi> strikes you for <ansi fg="damage">{damage} damage</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a weak hit on you, causing <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> heaves their <ansi fg="item">{itemname}</ansi> but does barely any damage to {actee}.'
      - '<ansi fg="{actortype}">{actor}</ansi> barely scratches <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a weak blow on <ansi fg="{acteetype}">{actee}</ansi>.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You chop <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi> and hit for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> strikes <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You land a solid hit on <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> chops you with their <ansi fg="item">{itemname}</ansi> and hits for <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> strikes you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit by <ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> chops <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi> and hits!'
      - '<ansi fg="{actortype}">{actor}</ansi> strikes <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> hits <ansi fg="{acteetype}">{actee}</ansi> solidly with their <ansi fg="item">{itemname}</ansi>!'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> cleaves <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a powerful blow to <ansi fg="{acteetype}">{actee}</ansi>, cleaving them for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your swing cleaves deeply into <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> cleaves you for <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a powerful cleaving blow, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are cleaved deeply by <ansi fg="{actortype}">{actor}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> cleaves <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a powerful cleaving blow to <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> cleaves deeply into <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY PULVERIZES</ansi> <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You <ansi fg="cyan-bold">DEVASTATE</ansi> <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL CLEAVE</ansi> to <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY PULVERIZES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">DEVASTATED</ansi> by <ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi>, taking <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL CLEAVE</ansi>, causing you <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY PULVERIZES</ansi> <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> <ansi fg="cyan-bold">DEVASTATES</ansi> <ansi fg="{acteetype}">{actee}</ansi> with a critical cleave!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL CLEAVE</ansi> to <ansi fg="{acteetype}">{actee}</ansi>!'
