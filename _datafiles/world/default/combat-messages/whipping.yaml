# UPSTREAM GoMud HOLDOVER. NOT LOADED BY DOGMud.
#
# The live combat-message store is _datafiles/world/dogmud/combat-messages.
# This tree is upstream content kept for merge tracking only: main.go passes
# it to util.ValidateWorldFiles, which compares top-level DIRECTORY NAMES and
# never opens a file.
#
# It could not load if it were pointed at. These files put a flat list under
# each role, while the schema expects beginner/expert/master tiers, and none
# of them defines the `fumble` intensity that Validate() requires. The wider
# tree is missing 30+ subsystems the engine loads unconditionally, so a boot
# against it would die long before it reached this directory.
#
# Do not edit these to match dogmud. See
# docs/superpowers/specs/2026-09-16-messaging-m3-item8-combat-messages-design.md
# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'whip'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: whipping
options:
  prepare:
    together:
      toattacker:
      - 'You unfurl your <ansi fg="item">{itemname}</ansi> and prepare to whip <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You grip your <ansi fg="item">{itemname}</ansi> tightly, eyeing <ansi fg="{acteetype}">{actee}</ansi> for an attack.'
      - 'You get ready to strike <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> unfurls their <ansi fg="item">{itemname}</ansi> and prepares to whip you.'
      - '<ansi fg="{actortype}">{actor}</ansi> eyes you menacingly, gripping their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to strike you with their <ansi fg="item">{itemname}</ansi>.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> unfurls their <ansi fg="item">{itemname}</ansi> and prepares to attack <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi>, focusing on <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> to strike <ansi fg="{acteetype}">{actee}</ansi>.'
