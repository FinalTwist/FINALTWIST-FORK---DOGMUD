# UPSTREAM GoMud HOLDOVER. NOT LOADED BY DOGMud.
#
# The live combat-message store is _datafiles/world/dogmud/combat-messages.
# This tree is upstream content kept for merge tracking only: main.go passes
# it to util.ValidateWorldFiles, which compares top-level DIRECTORY NAMES and
# never opens a file.
#
# It could not load if it were pointed at. These files put a flat list under
# each role, while the schema expects beginner/expert/master tiers, and none
# of them defines the `fumble` intensity that Validate() requires. The wider
# tree is missing 30+ subsystems the engine loads unconditionally, so a boot
# against it would die long before it reached this directory.
#
# Do not edit these to match dogmud. See
# docs/superpowers/specs/completed/2026-09-16-messaging-m3-item8-combat-messages-design.md
# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: bludgeoning
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You heft your <ansi fg="item">{itemname}</ansi>, readying yourself against <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You grip your <ansi fg="item">{itemname}</ansi> tightly, eyeing <ansi fg="{acteetype}">{actee}</ansi> for battle.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> hefts their <ansi fg="item">{itemname}</ansi>, eyeing you menacingly.'
      - '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> and focuses on you.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, preparing to engage <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi>, eyes fixed on <ansi fg="{acteetype}">{actee}</ansi>.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You circle around <ansi fg="{acteetype}">{actee}</ansi>, looking for an opening.'
      - 'You watch <ansi fg="{acteetype}">{actee}</ansi> closely, waiting for the perfect moment to strike.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> circles dangerously.'
      - '<ansi fg="{actortype}">{actor}</ansi> watches you intently, their <ansi fg="item">{itemname}</ansi> at the ready.'
      - '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> steady, eyeing you carefully.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with cruel intentions.'
      - '<ansi fg="{actortype}">{actor}</ansi> stalks around <ansi fg="{acteetype}">{actee}</ansi>, awaiting an opportunity.'
      - '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi> warily, ready to strike.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You swing your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, but miss!'
      - 'Your swing at <ansi fg="{acteetype}">{actee}</ansi> misses completely!'
      - 'You attempt to smash <ansi fg="{acteetype}">{actee}</ansi>, but fail to connect!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> swings their <ansi fg="item">{itemname}</ansi> at you, but misses!'
      - '<ansi fg="{actortype}">{actor}</ansi> swings wildly but fails to hit you!'
      - '<ansi fg="{actortype}">{actor}</ansi> tries to smash you but misses!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> swings their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, but misses!'
      - '<ansi fg="{actortype}">{actor}</ansi> swings at <ansi fg="{acteetype}">{actee}</ansi> but misses completely.'
      - '<ansi fg="{actortype}">{actor}</ansi> attempts to smash <ansi fg="{acteetype}">{actee}</ansi> but fails to connect!'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You heave your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, but it bounces off for <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your <ansi fg="item">{itemname}</ansi> barely affects <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You land a weak blow on <ansi fg="{acteetype}">{actee}</ansi>, dealing only <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> heaves their <ansi fg="item">{itemname}</ansi> but does barely <ansi fg="damage">{damage} damage</ansi> to you.'
      - 'You feel a light impact as <ansi fg="{actortype}">{actor}</ansi> strikes you for <ansi fg="damage">{damage} damage</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a weak hit on you, causing <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> heaves their <ansi fg="item">{itemname}</ansi> but does barely any damage to <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> barely affects <ansi fg="{acteetype}">{actee}</ansi> with their attack.'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a weak blow on <ansi fg="{acteetype}">{actee}</ansi>.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You swing your <ansi fg="item">{itemname}</ansi> and hit <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> connects solidly with <ansi fg="{acteetype}">{actee}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You land a solid blow on <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> swings their <ansi fg="item">{itemname}</ansi> and hits you for <ansi fg="damage">{damage}</ansi>!'
      - 'You are struck by <ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi>, taking <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a solid blow on you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> swings their <ansi fg="item">{itemname}</ansi> and hits <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> connects with <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a solid blow on <ansi fg="{acteetype}">{actee}</ansi>!'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> lands squarely on <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a powerful smash to <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your heavy swing hits <ansi fg="{acteetype}">{actee}</ansi> hard, dealing significant damage of <ansi fg="damage">{damage}</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> lands squarely on you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit hard as <ansi fg="{actortype}">{actor}</ansi> smashes you for <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi>''s heavy swing deals significant damage of <ansi fg="damage">{damage} damage</ansi> to you!'
      toroom:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> lands squarely on <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a powerful smash to <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi>''s heavy swing hits <ansi fg="{acteetype}">{actee}</ansi> hard!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY SMASHES</ansi> <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a <ansi fg="cyan-bold">CRITICAL SMASH</ansi> to <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRUSHES</ansi> <ansi fg="{acteetype}">{actee}</ansi>, dealing a massive <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY SMASHES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">CRITICALLY SMASHED</ansi> by <ansi fg="{actortype}">{actor}</ansi>, taking <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRUSHES</ansi> you, dealing a massive <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY SMASHES</ansi> <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL SMASH</ansi> to <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> <ansi fg="cyan-bold">CRUSHES</ansi> <ansi fg="{acteetype}">{actee}</ansi> with a massive blow!'
