# UPSTREAM GoMud HOLDOVER. NOT LOADED BY DOGMud.
#
# The live combat-message store is _datafiles/world/dogmud/combat-messages.
# This tree is upstream content kept for merge tracking only: main.go passes
# it to util.ValidateWorldFiles, which compares top-level DIRECTORY NAMES and
# never opens a file.
#
# It could not load if it were pointed at. These files put a flat list under
# each role, while the schema expects beginner/expert/master tiers, and none
# of them defines the `fumble` intensity that Validate() requires. The wider
# tree is missing 30+ subsystems the engine loads unconditionally, so a boot
# against it would die long before it reached this directory.
#
# Do not edit these to match dogmud. See
# docs/superpowers/specs/completed/2026-09-16-messaging-m3-item8-combat-messages-design.md
# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: generic
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You ready yourself to face <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>.'
      - 'You grip your <ansi fg="item">{itemname}</ansi> tightly, preparing to battle <ansi fg="{acteetype}">{actee}</ansi>.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> and focuses on you.'
      - '<ansi fg="{actortype}">{actor}</ansi> locks eyes with you, weapon in hand.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> against <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> and faces <ansi fg="{acteetype}">{actee}</ansi> in battle stance.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You prepare to attack <ansi fg="{acteetype}">{actee}</ansi> from a distance.'
      - 'You get ready to strike at <ansi fg="{acteetype}">{actee}</ansi> through the <ansi fg="exit">{exitname}</ansi>.'
      todefender:
      - 'You sense that someone is preparing to attack you from afar.'
      - 'You feel a hostile presence coming from the <ansi fg="exit">{entrancename}</ansi> direction.'
      toattackerroom:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to attack towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> towards the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
      - 'A feeling of unease passes through the room.'
      - 'The air feels tense, as if a battle is about to begin.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You study <ansi fg="{acteetype}">{actee}</ansi>, looking for an opening.'
      - 'You watch <ansi fg="{acteetype}">{actee}</ansi> intently, biding your time.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> circles you dangerously.'
      - '<ansi fg="{actortype}">{actor}</ansi> watches your every move.'
      - '<ansi fg="{actortype}">{actor}</ansi> waits for the right moment to strike.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with cruel intentions.'
      - '<ansi fg="{actortype}">{actor}</ansi> watches <ansi fg="{acteetype}">{actee}</ansi> carefully.'
      - '<ansi fg="{actortype}">{actor}</ansi> seems poised to attack <ansi fg="{acteetype}">{actee}</ansi> at any moment.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You patiently wait for the right moment to attack <ansi fg="{acteetype}">{actee}</ansi> from afar.'
      - 'You keep your focus on <ansi fg="{acteetype}">{actee}</ansi>, ready to act when the time is right.'
      todefender:
      - 'An uneasy feeling washes over you.'
      - 'You sense that someone is watching you.'
      toattackerroom:
      - '<ansi fg="{actortype}">{actor}</ansi> waits silently, focused on a distant target.'
      - '<ansi fg="{actortype}">{actor}</ansi> seems lost in concentration.'
      todefenderroom:
      - 'A sense of anticipation fills the air.'
      - 'Everything feels strangely still.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You miss with your <ansi fg="item">{itemname}</ansi>.'
      - 'Your attack fails to hit <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You swing your <ansi fg="item">{itemname}</ansi>, but miss completely!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> missed you with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> swings at you but misses!'
      - '<ansi fg="{actortype}">{actor}</ansi>''s attack goes wide.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> missed <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> swings at <ansi fg="{acteetype}">{actee}</ansi>, but misses.'
      - '<ansi fg="{actortype}">{actor}</ansi> attacks <ansi fg="{acteetype}">{actee}</ansi> but fails to connect.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your attack misses <ansi fg="{acteetype}">{actee}</ansi> from afar.'
      - 'You attempt to hit <ansi fg="{acteetype}">{actee}</ansi>, but your attack fails to reach.'
      todefender:
      - 'You feel a sudden rush of wind, but nothing happens.'
      - 'An attack comes your way but misses.'
      toattackerroom:
      - '<ansi fg="{actortype}">{actor}</ansi> attempts an attack into the distance, but misses.'
      - '<ansi fg="{actortype}">{actor}</ansi> attacks towards the <ansi fg="exit">{exitname}</ansi>, but nothing happens.'
      todefenderroom:
      - 'An attack seems to come from elsewhere, but fails to hit anyone.'
      - 'You hear a distant sound of an attack missing its mark.'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> barely manages to damage <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You land a weak hit on <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your attack only slightly injures <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> manages to weakly hit you for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You barely feel the impact as <ansi fg="{actortype}">{actor}</ansi> hits you for <ansi fg="damage">{damage} damage</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a weak blow on you, causing <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> manages to weakly hit <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a weak hit on <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> barely injures <ansi fg="{acteetype}">{actee}</ansi>.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your distant attack barely scratches <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You manage to inflict minor damage on <ansi fg="{acteetype}">{actee}</ansi> from afar, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - 'An attack from afar slightly injures you for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You feel a slight pain as a distant attack hits you for <ansi fg="damage">{damage} damage</ansi>.'
      toattackerroom:
      - '<ansi fg="{actortype}">{actor}</ansi> attacks into the distance, slightly injuring someone.'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a weak hit on a distant target.'
      todefenderroom:
      - 'A minor attack comes from elsewhere, slightly injuring <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{acteetype}">{actee}</ansi> winces as a distant attack causes minor damage.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> connects with <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You hit <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your attack strikes <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> connects with you for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You are hit by <ansi fg="{actortype}">{actor}</ansi>''s attack for <ansi fg="damage">{damage} damage</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> strikes you with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '<ansi fg="{actortype}">{actor}''s</ansi> <ansi fg="item">{itemname}</ansi> connects with <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> hits <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> strikes <ansi fg="{acteetype}">{actee}</ansi>, dealing damage.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your attack from afar hits <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You successfully strike <ansi fg="{acteetype}">{actee}</ansi> from a distance, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - 'An attack from afar hits you for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You are struck by a distant attack, taking <ansi fg="damage">{damage} damage</ansi>.'
      toattackerroom:
      - '<ansi fg="{actortype}">{actor}</ansi> attacks into the distance, hitting their target.'
      - '<ansi fg="{actortype}">{actor}</ansi> successfully strikes a distant foe.'
      todefenderroom:
      - 'An attack comes from elsewhere, hitting <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{acteetype}">{actee}</ansi> is struck by a distant attack.'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You wallop <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a powerful blow to <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> hits <ansi fg="{acteetype}">{actee}</ansi> hard for <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> wallops you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> smashes you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit hard by <ansi fg="{actortype}">{actor}</ansi>, taking <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> wallops <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> smashes <ansi fg="{acteetype}">{actee}</ansi> with a powerful blow!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a heavy hit to <ansi fg="{acteetype}">{actee}</ansi>!'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You deliver a powerful attack from afar to <ansi fg="{acteetype}">{actee}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your attack from a distance hits <ansi fg="{acteetype}">{actee}</ansi> heavily for <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - 'A powerful attack from afar hits you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are struck hard by a distant attack, taking <ansi fg="damage">{damage} damage</ansi>!'
      toattackerroom:
      - '<ansi fg="{actortype}">{actor}</ansi> launches a heavy attack into the distance.'
      - '<ansi fg="{actortype}">{actor}</ansi> unleashes a powerful strike towards a distant target.'
      todefenderroom:
      - 'A powerful attack comes from elsewhere, hitting <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{acteetype}">{actee}</ansi> is hit hard by a distant attack!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You <ansi fg="cyan-bold">CRITICALLY HIT</ansi> <ansi fg="{acteetype}">{actee}</ansi> with <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY STRIKES</ansi> <ansi fg="{acteetype}">{actee}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You land a <ansi fg="cyan-bold">CRITICAL HIT</ansi> on <ansi fg="{acteetype}">{actee}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> <ansi fg="cyan-bold">CRITICALLY HITS</ansi> you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi>''s attack <ansi fg="cyan-bold">CRITICALLY STRIKES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">CRITICALLY HIT</ansi> by <ansi fg="{actortype}">{actor}</ansi>, taking <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> <ansi fg="cyan-bold">CRITICALLY HITS</ansi> <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> lands a <ansi fg="cyan-bold">CRITICAL HIT</ansi> on <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> <ansi fg="cyan-bold">DEVASTATES</ansi> <ansi fg="{acteetype}">{actee}</ansi> with their attack!'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You <ansi fg="cyan-bold">CRITICALLY HIT</ansi> <ansi fg="{acteetype}">{actee}</ansi> from afar for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your distant attack <ansi fg="cyan-bold">CRITICALLY STRIKES</ansi> <ansi fg="{acteetype}">{actee}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - 'A <ansi fg="cyan-bold">CRITICAL HIT</ansi> from afar strikes you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">CRITICALLY STRUCK</ansi> by a distant attack, taking <ansi fg="damage">{damage} damage</ansi>!'
      toattackerroom:
      - '<ansi fg="{actortype}">{actor}</ansi> unleashes a devastating attack into the distance!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi> towards a distant target!'
      todefenderroom:
      - 'A devastating attack comes from elsewhere, <ansi fg="cyan-bold">CRITICALLY HITTING</ansi> <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{acteetype}">{actee}</ansi> is <ansi fg="cyan-bold">CRITICALLY STRUCK</ansi> by a distant attack!'
