    - "Loaded boughs shed sudden sleeves of snow with a soft thump."
indoor:
  default:
    mild: []
    strong:
      - "Snow ticks softly against the windowpanes, a sound too soft to place."
      - "A hush presses in against the walls, deep and close and complete."
      - "Cold seeps up through the floorboards; the fire seems to give less heat."
      - "Snowlight seeps in pale and bright, lighting the room strangely well."
      - "The draft in the chimney falls quiet, as if the snow has stopped it up."
