weather: snow
outdoor:
  default:
    - "Snow sifts down in fat, unhurried flakes."
    - "The world's sounds arrive muffled, wrapped in falling snow."
    - "Snow gathers in the creases of your clothes and melts to cold water."
    - "A soft white layer settles over everything, smoothing every edge."
    - "Footprints behind you fill in slowly, softened by the falling snow."
    - "The cold has a gentle weight to it, quiet rather than biting."
  forest:
    - "Loaded boughs shed sudden sleeves of snow with a soft thump."
    - "Snow gathers thick along every branch before letting go all at once."
    - "The forest floor lies hushed under an even, unbroken white."
    - "Trunks wear a thin stripe of snow on their windward side."
    - "Undergrowth vanishes beneath the snow, leaving only soft white mounds."
    - "Needles overhead sag under snow, then spring back bare and dark."
indoor:
  default:
    mild: []
    strong:
      - "Snow ticks softly against the windowpanes, a sound too soft to place."
      - "A hush presses in against the walls, deep and close and complete."
      - "Cold seeps up through the floorboards; the fire seems to give less heat."
      - "Snowlight seeps in pale and bright, lighting the room strangely well."
      - "The draft in the chimney falls quiet, as if the snow has stopped it up."
      - "A thin white line of snow creeps in along the windowsill."
# Underground is deliberately silent for this type: snow falls without sound
# and a cave has no way to register it. An empty pool is the authored answer,
# not a gap. See the owner ruling that silence is the default underground.
underground:
  default:
    mild: []
    strong: []
