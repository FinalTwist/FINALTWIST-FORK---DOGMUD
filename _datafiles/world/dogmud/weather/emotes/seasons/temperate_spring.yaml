track: temperate
season: spring
# No underground section by design: deep stone does not register a season, so
# a cave gets no seasonal ambience rather than borrowing prose written for a
# built interior. The section CAN now be authored here if that judgement ever
# changes; before this it would have been silently dropped by the parser.
outdoor:
  default:
    - "Meltwater chuckles somewhere out of sight."
    - "New green pushes up through last year's mat of leaves."
    - "The air still carries a faint chill, even where the sun reaches."
    - "Buds swell tight on branches still mostly bare of leaves."
    - "A scattering of early blossoms nods in the mild breeze."
    - "The ground underfoot feels soft, no longer locked hard by frost."
indoor:
  default:
    strong:
      - "The smell of wet, waking earth drifts in from outside."
      - "A stripe of pale sunlight reaches across the floorboards."
      - "The chill indoors has eased, though the stone floor stays cool."
      - "Birdsong slips in thin through the shutters."
      - "Damp patches on the walls are slowly fading pale again."
      - "A draft through the door carries a hint of warmth."
