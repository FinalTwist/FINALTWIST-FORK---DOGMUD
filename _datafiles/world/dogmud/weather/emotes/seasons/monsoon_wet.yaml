track: monsoon
season: wet
# No underground section by design: deep stone does not register a season, so
# a cave gets no seasonal ambience rather than borrowing prose written for a
# built interior. The section CAN now be authored here if that judgement ever
# changes; before this it would have been silently dropped by the parser.
outdoor:
  default:
    - "Everything drips; the air itself feels half water."
    - "Steam rises wherever the sun briefly finds wet ground."
  forest:
    - "The canopy drips on long after the rain has stopped, a slow second rainfall."
    - "Mist coils up from the forest floor wherever light leans through the leaves."
indoor:
  default:
    strong:
      - "Mould-sweet damp has crept into every corner of the room."
