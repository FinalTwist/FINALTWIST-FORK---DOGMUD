  on the conjurer's conviction is devastating.
attack_type: none
damage_type: non_harm
targeting: self
schools:
  - manifestation
cost: 50
waitrounds: 5
difficulty: 55
primarystat: charisma
base_folds: 14
effect_type: none
effect_magnitude: 0
cast_actor: >-
  You force your will through both the earth and fire planes
