spellid: raise-wraith
name: Raise Wraith
aliases: [wraith]
description: Tears the lingering spirit from a corpse and binds it into
  an ethereal form, half ghost and half hunger. Wraiths are difficult to
  strike and sap the will of those they wound. Only a creature of
  considerable essence can sustain this transformation.
attack_type: none
damage_type: non_harm
targeting: self
schools:
  - manifestation
cost: 35
waitrounds: 8
difficulty: 30
primarystat: charisma
base_folds: 8
effect_type: none
effect_magnitude: 0
cast_actor: >-
  You reach beyond flesh and bone, grasping for the shadow-self
  that still clings to these remains...
cast_observer: >-
  {actor} raises both hands, pulling at something invisible above
  the remains. The air grows cold and still.
wait_actor: >-
  Ethereal threads weave through the air, pulling at the lingering
  spirit. Something cold and furious stirs at the edge of your
  vision...
summon_mob_id: 302
summon_pet_multiplier: 0.58
summon_requires_corpse: true
summon_min_corpse_pool: 120
