spellid: raise-skeleton
name: Raise Skeleton
aliases: [skeleton]
description: Animates the bones of a nearby corpse, stripping flesh and
  sinew away to leave a rattling skeleton servant under your command.
  The weakest of the raised undead, but requiring little essence to
  conjure. Almost any corpse will do.
attack_type: none
damage_type: non_harm
targeting: self
schools:
  - manifestation
cost: 30
waitrounds: 4
difficulty: 10
primarystat: charisma
base_folds: 4
effect_type: none
effect_magnitude: 0
cast_actor: >-
  You extend your will toward the fallen, reaching for the echoes
  of life still clinging to the bones...
cast_observer: >-
  {actor}'s hands trace patterns in the air above the remains,
  dark energy gathering at their fingertips.
wait_actor: >-
  Dark energy crackles along the bones, stripping away the last
  of their flesh. Something dry and purposeful stirs beneath your
  will...
summon_mob_id: 300
summon_pet_multiplier: 0.50
summon_requires_corpse: true
summon_min_corpse_pool: 30
