# Counter narration for the SOCIAL channel (U6b Task 11): a defy crit
# against a taunt fires the COUNTER-TAUNT, turning the jeer back on the one
# who threw it. No swing, no steel: every line here is words and nerve.
# {actee} is the COUNTERER (whose defy critted); {actor} is the
# original taunter. Bands: weak = the retort fails to bite (no conviction
# damage), normal = the retort lands, heavy = the retort crits.
optionid: counter-defy
options:
  weak:
    together:
      actee:
      - '<ansi fg="defense-good">You twist {actor}''s jeer around, but it fails to bite.</ansi>'
      - '<ansi fg="defense-good">You throw the taunt back at {actor}, but they only sneer.</ansi>'
      - '<ansi fg="defense-good">You snap a barb back at {actor}, but it slides off their pride.</ansi>'
      - '<ansi fg="defense-good">You mock {actor}''s own words, but they refuse the bait.</ansi>'
      - '<ansi fg="defense-good">Your retort reaches {actor}, but their nerve holds.</ansi>'
      actor:
      - '<ansi fg="attack-bad">{actee} twists your jeer around, but it fails to bite.</ansi>'
      - '<ansi fg="attack-bad">{actee} throws your taunt back at you, but you only sneer.</ansi>'
      - '<ansi fg="attack-bad">{actee} snaps a barb back at you, but it slides off your pride.</ansi>'
      - '<ansi fg="attack-bad">{actee} mocks your own words back at you, but you refuse the bait.</ansi>'
      - '<ansi fg="attack-bad">{actee}''s retort reaches you, but your nerve holds.</ansi>'
      observer:
      - '<ansi fg="combat">{actee} twists {actor}''s jeer back around, but it fails to bite.</ansi>'
      - '<ansi fg="combat">{actee} throws the taunt back at {actor}, who only sneers.</ansi>'
      - '<ansi fg="combat">{actee} snaps a barb back at {actor}, but it slides off their pride.</ansi>'
      - '<ansi fg="combat">{actee} mocks {actor}''s own words, but the bait is refused.</ansi>'
      - '<ansi fg="combat">{actee}''s retort reaches {actor}, but their nerve holds.</ansi>'
  normal:
    together:
      actee:
      - '<ansi fg="defense-good">You twist the jeer around and send it home, and {actor} flinches.</ansi>'
      - '<ansi fg="defense-good">You throw {actor}''s taunt right back, and it stings.</ansi>'
      - '<ansi fg="defense-good">Your retort lands, and {actor}''s bravado wavers.</ansi>'
      - '<ansi fg="defense-good">You answer mockery with mockery, and {actor}''s face falls.</ansi>'
      - '<ansi fg="defense-good">You turn {actor}''s own words against them, and they bite deep.</ansi>'
      actor:
      - '<ansi fg="attack-bad">{actee} twists your jeer around and sends it home, and you flinch.</ansi>'
      - '<ansi fg="attack-bad">{actee} throws your taunt right back, and it stings.</ansi>'
      - '<ansi fg="attack-bad">{actee}''s retort lands, and your bravado wavers.</ansi>'
      - '<ansi fg="attack-bad">{actee} answers your mockery in kind, and your face falls.</ansi>'
      - '<ansi fg="attack-bad">{actee} turns your own words against you, and they bite deep.</ansi>'
      observer:
      - '<ansi fg="combat">{actee} twists the jeer around and sends it home, and {actor} flinches.</ansi>'
      - '<ansi fg="combat">{actee} throws {actor}''s taunt right back, and it stings.</ansi>'
      - '<ansi fg="combat">{actee}''s retort lands, and {actor}''s bravado wavers.</ansi>'
      - '<ansi fg="combat">{actee} answers {actor}''s mockery in kind, and their face falls.</ansi>'
      - '<ansi fg="combat">{actee} turns {actor}''s own words against them, and they bite deep.</ansi>'
  heavy:
    together:
      actee:
      - '<ansi fg="defense-good">You turn the taunt inside out, and {actor} is left speechless.</ansi>'
      - '<ansi fg="defense-good">Your retort cuts to the bone, and {actor}''s composure cracks.</ansi>'
      - '<ansi fg="defense-good">You fling the jeer back sharper than it came, and {actor} pales.</ansi>'
      - '<ansi fg="defense-good">You strip {actor}''s bluster bare, and shame does the rest.</ansi>'
      - '<ansi fg="defense-good">Your answer lands like a slap, and {actor} falters.</ansi>'
      actor:
      - '<ansi fg="attack-bad">{actee} turns your taunt inside out, and you are left speechless.</ansi>'
      - '<ansi fg="attack-bad">{actee}''s retort cuts to the bone, and your composure cracks.</ansi>'
      - '<ansi fg="attack-bad">{actee} flings your jeer back sharper than it came, and you pale.</ansi>'
      - '<ansi fg="attack-bad">{actee} strips your bluster bare, and shame does the rest.</ansi>'
      - '<ansi fg="attack-bad">{actee}''s answer lands like a slap, and you falter.</ansi>'
      observer:
      - '<ansi fg="combat">{actee} turns the taunt inside out, and {actor} is left speechless.</ansi>'
      - '<ansi fg="combat">{actee}''s retort cuts to the bone, and {actor}''s composure cracks.</ansi>'
      - '<ansi fg="combat">{actee} flings the jeer back sharper than it came, and {actor} pales.</ansi>'
      - '<ansi fg="combat">{actee} strips {actor}''s bluster bare, and shame does the rest.</ansi>'
      - '<ansi fg="combat">{actee}''s answer lands like a slap, and {actor} falters.</ansi>'
