moveid: throttle
events:
  hit:
    actee:
      - '{actor} clamps crushing fangs around your throat, cutting off your air! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} clamps crushing fangs around {actee}''s throat!'
  cast_interrupt:
    actee:
      - '{actor}''s choke shatters your concentration — your spell collapses!'
  partial:
    actee:
      - '{actor} lunges for your throat and you pull mostly free, but the fangs still catch you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} lunges for {actee}''s throat, who pulls mostly free but still gets grazed!'
  miss:
    actee:
      - '{actor} lunges for your throat but misses!'
    observer:
      - '{actor} lunges for {actee}''s throat but misses!'
  # player_* events are the PLAYER twin's own wording (M4e-1b, option B): the
  # twins shipped different prose for the same event, so they take separate
  # keys rather than sharing the mob events above. Merging them into one pool
  # is filed as M6 ledger row 56.
  #
  # SQUARING (M4e-1b Task 4b Step 2): each role drew its own util.Rand
  # pre-migration, so the three pools were ragged (hit 4/3/2, partial 2/2/1,
  # miss 3/2/1). Every pre-existing line stays at its own index, byte for
  # byte; the added lines fill the gap to the widest role's width. Unlike
  # drain/maul/rake, throttle's miss is NOT divergent -- it squares by the
  # ordinary sibling method, same as hit and partial.
  player_hit:
    actor:
      - 'Your fangs clamp around {actee}''s throat, cutting off their air! (<ansi fg="damage">{damage}</ansi>)'
      - 'You seize {actee} by the throat with savage fangs, crushing their windpipe! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your jaws lock around {actee}''s neck in a crushing choke! (<ansi fg="damage">{damage}</ansi>)'
      - 'You drive your fangs into {actee}''s throat and squeeze! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor}''s fangs clamp around your throat, cutting off your air! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} seizes your throat with savage fangs, crushing your windpipe! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s jaws lock around your neck in a crushing choke! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} drives their fangs into your throat and squeezes! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} clamps fangs around {actee}''s throat in a savage choke!'
      - '{actor} seizes {actee} by the throat with crushing fangs!'
      - '{actor}''s jaws lock around {actee}''s neck in a crushing choke!'
      - '{actor} drives their fangs into {actee}''s throat and squeezes!'
  # A detail line riding on player_hit above, and a WORLD EVENT under the
  # detail-line ruling: a spell visibly failing is something the room can
  # see, so it carries all three viewpoints. Not squared: this was already a
  # hardcoded 1/1/1 triad pre-migration (throttle.go's own comment calls it
  # out), not a pool -- see the plan's "looks like a missed pool; is not
  # one." The Observer role rides CategorySpellDisruption rather than the
  # hit event's CategoryHitNaturalSharp, same as pre-migration.
  player_cast_interrupt:
    actor:
      - '{actee}''s spell collapses as they fight for air!'
    actee:
      - 'Your spell collapses as you fight for air!'
    observer:
      - '{actor}''s grip chokes the spell out of {actee}!'
  player_partial:
    actor:
      - 'Your throttle lunge mostly misses {actee}''s throat, but your fangs still graze it! (<ansi fg="damage">{damage}</ansi>)'
      - '{actee} pulls mostly free of your grip, but your fangs still catch their throat! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} lunges for your throat and you pull mostly free, but the fangs still catch you! (<ansi fg="damage">{damage}</ansi>)'
      - 'You twist mostly away as {actor} snaps at your throat, but not all the way! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} lunges for {actee}''s throat, who pulls mostly free but still gets grazed!'
      - '{actor} snaps at {actee}''s throat, who twists mostly away but not all the way!'
  player_miss:
    actor:
      - 'Your throttle lunge misses {actee}''s throat!'
      - 'You snap at {actee}''s throat but they pull away!'
      - '{actee} twists away before your fangs can find their throat!'
    actee:
      - '{actor} lunges for your throat but misses!'
      - 'You twist away as {actor} snaps at your throat!'
      - 'You twist away before {actor}''s fangs can find your throat!'
    observer:
      - '{actor} lunges for {actee}''s throat but misses!'
      - '{actor} snaps at {actee}''s throat, who pulls away!'
      - '{actee} twists away before {actor}''s fangs can find their throat!'
