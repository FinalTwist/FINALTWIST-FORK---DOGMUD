moveid: drain
events:
  hit:
    actor:
      - 'Your claws plunge into {actee}, sapping their vitality as warmth floods into you! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} plunges into you, sapping your vitality and leeching your life-force! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} plunges into {actee} and leeches their vitality!'
  partial:
    actor:
      - 'Your reach for {actee} mostly fails, but your claws still catch a sliver of vitality! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} reaches for you and you slip most of its grip, but it still catches a sliver of you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} reaches for {actee} hungrily, who slips mostly free but still gets caught!'
  miss:
    actor:
      - 'Your drain misses {actee}!'
      - 'You reach for {actee} but they slip away!'
      - 'Your draining lunge glances off {actee} harmlessly!'
    actee:
      - '{actor} reaches for you hungrily, but misses!'
      - '{actor} lunges to drain you but you slip away!'
      - '{actor}''s draining lunge glances off you harmlessly!'
    observer:
      - '{actor} reaches for {actee} hungrily, but misses!'
      - '{actor} reaches for {actee}, who slips away!'
      - '{actor}''s draining lunge glances off {actee} harmlessly!'
