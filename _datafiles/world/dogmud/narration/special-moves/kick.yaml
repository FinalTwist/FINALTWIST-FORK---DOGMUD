moveid: kick
events:
  standard_knockdown:
    actor:
      - 'Your powerful <ansi fg="yellow-bold">kick</ansi> knocks {actee} to the ground! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor}''s powerful <ansi fg="yellow-bold">kick</ansi> knocks you to the ground! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} kicks {actee}, knocking them to the ground!'
  standard_hit:
    actor:
      - 'Your <ansi fg="yellow-bold">kick</ansi> strikes {actee}! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} kicks you hard! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} kicks {actee}!'
  standard_partial:
    actor:
      - 'You swing a kick at {actee}; they slip most of it, but not all! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} attempts to kick you, and you slip most of it, but the boot still clips you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} swings a kick at {actee}, who mostly dodges but still gets clipped!'
  standard_miss:
    actor:
      - 'Your <ansi fg="yellow-bold">kick</ansi> misses {actee}!'
    actee:
      - '{actor} attempts to kick you, but misses!'
    observer:
      - '{actor} attempts to kick {actee}, but misses!'
  stomp_hit:
    actor:
      - 'You slam your foot into the downed {actee}! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} stomps on you while you''re down! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} stomps on the downed {actee}!'
  stomp_partial:
    actor:
      - 'You try to stomp {actee}; they roll aside, but your heel still catches them! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} tries to stomp you, and you roll aside, but the heel still catches you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} tries to stomp {actee}, who rolls mostly clear but still gets caught!'
  stomp_miss:
    actor:
      - 'You try to stomp {actee}, but they roll aside!'
    actee:
      - '{actor} tries to stomp you, but you roll aside!'
    observer:
      - '{actor} tries to stomp {actee}, but misses!'
  knee_hit:
    actor:
      - 'You drive a knee into {actee}! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} drives a knee into you in the grapple! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} drives a knee into {actee}!'
  knee_partial:
    actor:
      - 'You try to knee {actee}; they block most of it, but the strike still lands! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} tries to knee you, and you block most of it, but it still lands! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} tries to knee {actee} in the grapple, who blocks most of it but still takes the hit!'
  knee_miss:
    actor:
      - '{actee} blocks your knee!'
      - 'Your knee strike glances off {actee}!'
      - 'You try to knee {actee}, but they turn their body away!'
    actee:
      - '{actor} tries to knee you, but you block it!'
      - '{actor}''s knee strike glances off you!'
      - '{actor} tries to knee you, but you turn your body away!'
    observer:
      - '{actor} tries to knee {actee}, but misses!'
      - '{actor}''s knee strike glances off {actee} in the grapple!'
      - '{actor} tries to knee {actee} in the grapple, but they block it!'
