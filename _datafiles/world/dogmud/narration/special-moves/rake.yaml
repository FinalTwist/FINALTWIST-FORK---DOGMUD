moveid: rake
events:
  hit:
    actee:
      - '{actor} rakes its claws across you, opening bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} rakes its claws across {actee}!'
  partial:
    actee:
      - '{actor} swipes its claws and you dodge most of it, but they still scratch you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} swipes its claws at {actee}, who mostly dodges but still gets scratched!'
  miss:
    actee:
      - '{actor} swipes its claws at you, but misses!'
    observer:
      - '{actor} swipes its claws at {actee}, but misses!'
  # player_* events are the PLAYER twin's own wording (M4e-1b, option B): the
  # twins shipped different prose for the same event, so they take separate
  # keys rather than sharing the mob events above. Merging them into one pool
  # is filed as M6 ledger row 56.
  #
  # SQUARING (M4e-1b Task 4b Step 2): each role drew its own util.Rand
  # pre-migration, so the three pools were ragged (hit 5/4/3, partial 2/2/1).
  # Every pre-existing line stays at its own index, byte for byte; the added
  # lines fill the gap to the widest role's width.
  player_hit:
    actor:
      - 'Your claws rake across {actee}, opening raking gashes that weep! (<ansi fg="damage">{damage}</ansi>)'
      - 'You slash {actee} with raking claws, leaving bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your raking strike tears into {actee}! (<ansi fg="damage">{damage}</ansi>)'
      - 'You drive your claws across {actee}''s flesh — blood wells up! (<ansi fg="damage">{damage}</ansi>)'
      - 'A vicious rake of your claws shreds {actee}! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} rakes their claws across you, opening bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} slashes you with raking claws! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s raking strike tears into you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} drives their claws across your flesh — you bleed! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s vicious rake of claws shreds you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} rakes their claws across {actee}!'
      - '{actor} slashes {actee} with raking claws!'
      - '{actor}''s claws tear into {actee}!'
      - '{actor} drives their claws across {actee}''s flesh, drawing blood!'
      - '{actor}''s vicious rake of claws shreds {actee}!'
  player_partial:
    actor:
      - 'Your raking claws mostly miss {actee}, but still leave a shallow scratch! (<ansi fg="damage">{damage}</ansi>)'
      - '{actee} dodges most of your swipe, but your claws still catch them! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} rakes their claws at you, and you dodge most of it, but they still scratch you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} swipes at you; you dodge most of it, but not all! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} rakes their claws at {actee}, who mostly dodges but still gets scratched!'
      - '{actor} swipes at {actee}, who dodges most of it but not all!'
  # DIVERGENT (Task 3, owner-approved 2026-09-21): the three roles describe
  # different feels -- plain miss / dodge / rake glances off -- rather than
  # one moment each. The actor pool already held all three feels natively;
  # the actee and observer additions are the owner-approved verbatim lines.
  player_miss:
    actor:
      - 'Your raking claws miss {actee}!'
      - 'You swipe at {actee} but they dodge your claws!'
      - 'Your rake glances off {actee} harmlessly!'
    actee:
      - '{actor} rakes their claws at you, but misses!'
      - '{actor} swipes at you but you dodge!'
      - '{actor}''s rake glances off you harmlessly!'
    observer:
      - '{actor} rakes their claws at {actee}, but misses!'
      - '{actor} swipes at {actee}, who dodges the claws!'
      - '{actor}''s rake glances off {actee} harmlessly!'
