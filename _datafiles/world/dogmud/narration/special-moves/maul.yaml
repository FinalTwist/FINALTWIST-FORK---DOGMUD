moveid: maul
events:
  hit:
    actee:
      - '{actor} savages you with vicious fangs, tearing bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} savages {actee} with vicious fangs!'
  partial:
    actee:
      - '{actor} snaps at you and you dodge most of it, but the fangs still tear you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} snaps its fangs at {actee}, who twists mostly free but still gets torn!'
  miss:
    actee:
      - '{actor} snaps its fangs at you, but misses!'
    observer:
      - '{actor} snaps its fangs at {actee}, but misses!'
  # player_* events are the PLAYER twin's own wording (M4e-1b, option B): the
  # twins shipped different prose for the same event, so they take separate
  # keys rather than sharing the mob events above. Merging them into one pool
  # is filed as M6 ledger row 56.
  #
  # SQUARING (M4e-1b Task 4b Step 2): each role drew its own util.Rand
  # pre-migration, so the three pools were ragged (hit 5/4/3, partial 2/2/1).
  # Every pre-existing line stays at its own index, byte for byte; the added
  # lines fill the gap to the widest role's width.
  player_hit:
    actor:
      - 'Your fangs savage {actee}, tearing wounds that weep blood! (<ansi fg="damage">{damage}</ansi>)'
      - 'You maul {actee}, worrying their flesh with savage fury! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your savage bite tears into {actee}! (<ansi fg="damage">{damage}</ansi>)'
      - 'You drive your fangs into {actee} and worry the wound viciously! (<ansi fg="damage">{damage}</ansi>)'
      - 'A brutal mauling drives your teeth deep into {actee}! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} savages you with their fangs, tearing bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} mauls you, worrying your flesh with savage fury! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s savage bite tears into you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} drives their fangs into you and worries the wound! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s brutal mauling drives their teeth deep into you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} savages {actee} with vicious fangs!'
      - '{actor} mauls {actee} savagely!'
      - '{actor}''s fangs tear deep into {actee}!'
      - '{actor} drives their fangs into {actee} and worries the wound viciously!'
      - '{actor}''s brutal mauling drives fangs deep into {actee}!'
  player_partial:
    actor:
      - 'Your fangs mostly miss {actee}, but still tear a shallow gash! (<ansi fg="damage">{damage}</ansi>)'
      - '{actee} twists free of your bite, but your fangs still rake them! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} snaps at you, and you dodge most of it, but the fangs still tear you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} lunges to maul you; you twist free of most of it, but not all! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} lunges to maul {actee}, who twists mostly free but still gets torn!'
      - '{actor} lunges to maul {actee}, who twists free of most of it but not all!'
  # DIVERGENT (Task 3, owner-approved 2026-09-21): the three roles describe
  # different feels -- bite misses / snap and dodge / lunge glances off --
  # rather than one moment each. The actor pool already held all three feels
  # natively; the actee and observer additions are the owner-approved
  # verbatim lines.
  player_miss:
    actor:
      - 'Your savage bite misses {actee}!'
      - 'You snap at {actee} but they dodge your fangs!'
      - 'Your mauling lunge glances off {actee} harmlessly!'
    actee:
      - '{actor} snaps their fangs at you, but misses!'
      - '{actor} lunges to maul you but you dodge!'
      - '{actor}''s mauling lunge glances off you harmlessly!'
    observer:
      - '{actor} lunges to maul {actee}, but misses!'
      - '{actor} snaps at {actee}, who dodges the fangs!'
      - '{actor}''s mauling lunge glances off {actee} harmlessly!'
