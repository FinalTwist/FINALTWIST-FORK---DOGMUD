moveid: shoot
events:
  hit:
    actee:
      - '{actor}''s shot strikes you!'
  partial:
    actee:
      - '{actor}''s shot goes wide, but the edge of it still clips you!'
  miss:
    actee:
      - '{actor}''s shot narrowly misses you!'
  fire_announce:
    observer:
      - '{actor} fires their {weapon} at {actee}!'
  fire_depart:
    observer:
      - '{actor} fires their {weapon} {exitname}ward.'
  # The defender's room sees the shot arrive. Go picks the key from two axes --
  # whether an exit back to the shooter is known, and the outcome -- so each of
  # the six is a COMPLETE sentence. An earlier draft composed this from
  # an origin and a verb fragment, which made hit/partial/miss carry a
  # remote_observer role holding half a clause. Enumerating costs six short
  # lines and buys a store where every authored value is a sentence.
  arrival_unknown_hit:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and strikes {actee}!'
  arrival_unknown_partial:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and clips {actee}!'
  arrival_unknown_miss:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and narrowly misses {actee}!'
  arrival_known_hit:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and strikes {actee}!'
  arrival_known_partial:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and clips {actee}!'
  arrival_known_miss:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and narrowly misses {actee}!'
  # player_* events are the PLAYER twin's own wording (M4e-1b, option B): the
  # twins shipped different prose for the same event, so they take separate
  # keys rather than sharing the mob events above. Merging them into one pool
  # is filed as M6 ledger row 56. Unlike the mob's actee-only hit/partial/miss,
  # the player's own shot carries a personal actor line too.
  player_hit:
    actor:
      - 'Your shot takes {actee} (<ansi fg="damage">{damage}</ansi>)!'
    actee:
      - '{actor}''s shot strikes you (<ansi fg="damage">{damage}</ansi>)!'
  player_partial:
    actor:
      - 'Your shot goes wide of {actee}, but the edge of it still clips them! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor}''s shot goes wide, but the edge of it still clips you! (<ansi fg="damage">{damage}</ansi>)'
  player_miss:
    actor:
      - 'Your shot goes wide of {actee}!'
    actee:
      - '{actor}''s shot narrowly misses you!'
  player_fire_announce:
    observer:
      - '{actor} fires their {weapon} at {actee}!'
  player_fire_depart:
    observer:
      - '{actor} fires their {weapon} {exitname}ward.'
  player_arrival_unknown_hit:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and strikes {actee}!'
  player_arrival_unknown_partial:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and clips {actee}!'
  player_arrival_unknown_miss:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and narrowly misses {actee}!'
  player_arrival_known_hit:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and strikes {actee}!'
  player_arrival_known_partial:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and clips {actee}!'
  player_arrival_known_miss:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and narrowly misses {actee}!'
