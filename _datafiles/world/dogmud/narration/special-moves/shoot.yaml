moveid: shoot
events:
  hit:
    actee:
      - '{actor_plain}''s shot strikes you!'
  partial:
    actee:
      - '{actor_plain}''s shot goes wide, but the edge of it still clips you!'
  miss:
    actee:
      - '{actor_plain}''s shot narrowly misses you!'
  fire_announce:
    observer:
      - '{actor} fires their {weapon} at {actee}!'
  fire_depart:
    observer:
      - '{actor} fires their {weapon} {exitname}ward.'
  # The defender's room sees the shot arrive. Go picks the key from two axes --
  # whether an exit back to the shooter is known, and the outcome -- so each of
  # the six is a COMPLETE sentence. An earlier draft composed this from
  # an origin and a verb fragment, which made hit/partial/miss carry a
  # remote_observer role holding half a clause. Enumerating costs six short
  # lines and buys a store where every authored value is a sentence.
  arrival_unknown_hit:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and strikes {actee}!'
  arrival_unknown_partial:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and clips {actee}!'
  arrival_unknown_miss:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and narrowly misses {actee}!'
  arrival_known_hit:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and strikes {actee}!'
  arrival_known_partial:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and clips {actee}!'
  arrival_known_miss:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and narrowly misses {actee}!'
