# M3 item 8 coordinated combat: the ARCHER.
#
# You are Range Student, seeded on the Long Terrace (5351) in Pothole Coulee
# with a sling and a pouch of shot already in hand. You can also fight with
# your fists.
#
# Your partner is a plain onlooker with no special senses. THEY are the
# instrument. You can only ever see your own line; what the ROOM was told is
# the thing under test, and only they can report it. Coordinate before each
# lane and keep them where the lane needs them.
#
# The change under test: a blow used to be described to each audience by an
# independent random draw, so one shot could be a miss to you and a solid hit
# to everyone watching. It now comes from one shared choice. Your job is to
# find any round where the two viewpoints still disagree.
#
# QUOTE LINES VERBATIM. A paraphrase is useless here, because the whole
# question is whether two sentences describe the same moment.
#
# 3 commands per round on the AI port and the overflow is dropped. Read every
# line before sending more.
#
# KNOWN NON-BUGS, do not refile: damage is words and never numbers; corpses
# persist for hours; a hidden mob answers "You attack the darkness!".

ephemeral:
  profile: ranged-range
  start_room: 5351
  budgets:
    wall_clock: 45m

goals:
  - >-
    SAME-ROOM SHOT. Find something to shoot on or near the terrace and fight it
    in the same room for at least four rounds. After every single round, put
    your own line on the party channel word for word and ask your partner for
    theirs. Do not batch this up at the end. A disagreement in round two is
    invisible if you only compare totals.
  - >-
    CROSS-ROOM SHOT, partner beside you. Put a room boundary between you and
    your target and shoot across it, with your partner in YOUR room. Ask what
    they were told. It should be about you loosing a shot out through an exit,
    and it should name a direction that matches the way you are actually
    shooting.
  - >-
    CROSS-ROOM SHOT, partner beside the TARGET. Same setup, but send your
    partner into the target's room first. This is the important one. Those
    lines were written from scratch in this change and nobody has ever seen
    them in play. Ask them for every line they get, including the quiet rounds
    before anything lands, and quote yours back so the pair can be compared.
  - >-
    THE OPENING ROUNDS. In a cross-room fight, the first rounds are you taking
    aim rather than hitting. With your partner beside the target, ask what they
    are told during those rounds. Silence there is a finding: there used to be
    nothing at all and eighteen lines were authored to fill it.
  - >-
    UNARMED MELEE. Put the sling away and punch something in melee for several
    rounds with your partner in the room, same verbatim comparison each round.
    The lines should read as fists, not as a weapon you are not holding.
  - >-
    ADVERSARIAL PASS. Report any literal curly-brace token, any doubled or
    missing name, any sentence starting lowercase, and above all any EMPTY
    combat line. An empty line is the specific way the new renderer fails: when
    it cannot line the viewpoints up it prints nothing rather than guessing.
  - >-
    PROSE. Fight long enough to see lines repeat. Report anything that reads
    wrong for the weapon, repeats clumsily inside one fight, or clutters a busy
    round. Most of this text has never been read by a person.
