# M3 item 8 coordinated combat: the WITNESS.
#
# You are the instrument of this run, not a spectator to it.
#
# Combat narrates a blow to several audiences at once: the one striking, the
# one struck, and everyone else in the room. The change under test made all of
# them come from a single shared choice, so that one blow reads as one event
# from every seat. Until now they were drawn independently.
#
# Your partner can only see their own line. The mob cannot report anything. So
# the ROOM's line exists, in this run, only if you write it down.
#
# YOUR JOB IS TO QUOTE, NOT TO SUMMARISE. Copy each line you are given word for
# word onto the party channel, in the round it arrived. "They hit it a few
# times" is worthless here. The entire question is whether your sentence and
# your partner's sentence describe the same moment, and that cannot be judged
# from a paraphrase.
#
# DO NOT FIGHT. Do not help. Do not heal. If you join in, your own combat lines
# will be mixed into the ones you are supposed to be reporting. Stand still and
# read.
#
# You will be asked to move between two rooms during the cross-room lanes. In a
# ranged fight the shooter's room and the target's room are told DIFFERENT
# things, and both are under test.
#
# 3 commands per round on the AI port and the overflow is dropped.
#
# KNOWN NON-BUGS, do not refile: damage is words and never numbers; corpses
# persist for hours.

ephemeral:
  # m2-witness, not fresh: deliberately plain, no night vision or infrared to
  # change what it can perceive, but enough survivability to stand next to a
  # fight without dying. A Fresh Recruit would be killed mid-lane and the
  # room's viewpoint would go unreported, which is the whole run.
  profile: m2-witness
  start_room: 5351
  budgets:
    wall_clock: 45m

goals:
  - >-
    SAME-ROOM SHOT. Stand in the room while your partner shoots something and
    do nothing else. After each round, quote every combat line you were given,
    verbatim, on the party channel. Then read their line and say plainly
    whether the two describe the same moment or two different ones.
  - >-
    CROSS-ROOM, SHOOTER'S SIDE. Stay with your partner while they shoot into
    the next room. Quote what you are told. It should be about them loosing a
    shot out through an exit, and the direction should match reality.
  - >-
    CROSS-ROOM, TARGET'S SIDE. Move into the room being shot INTO and stand
    there. This is the lane that matters most. Quote every line, including the
    rounds where nothing lands. These lines were written from scratch and have
    never been seen in play, so both a missing line and an awkward one are real
    findings. Say explicitly if you are told nothing at all.
  - >-
    THE QUIET ROUNDS. During the opening of a cross-room fight, before any shot
    connects, report what you are told from the target's room. Silence there is
    a finding, not a non-event.
  - >-
    UNARMED MELEE. Stand in the room while your partner fights with fists.
    Same per-round verbatim quoting. The lines should read as fists.
  - >-
    ADVERSARIAL PASS. Flag any literal curly-brace token, any doubled or
    missing name, any sentence starting lowercase, and any EMPTY line where a
    blow should have been described. A blank is the specific way this change
    fails, so do not dismiss one as a display quirk.
  - >-
    PROSE. You will see these lines more often than anyone. Report any that
    read oddly, repeat clumsily within one fight, or crowd a busy round.
