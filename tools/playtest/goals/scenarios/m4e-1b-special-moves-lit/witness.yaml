# M4e PR 1b: the WITNESS. You are Ordel Quist, standing in the Test Arena
# Champion's Pit (room 204) with Sil Vantage. You are the INSTRUMENT of this
# run: stand still, read, and quote every line WORD FOR WORD.
#
# You do not fight. You do not help. You do not heal. You watch and you write
# it down. If something attacks you, move one room away, wait for it to lose
# interest, and come back; do not swing at it.
#
# You are carrying a Cat's Eye Draught. Do NOT drink it. The room is already
# lit and the whole point of this run is that everyone can see.
#
# 3 commands per round on the AI port; the overflow is dropped.

ephemeral:
  profile: m2-witness
  start_room: 204
  budgets:
    wall_clock: 35m

goals:
  - >-
    FIRST COMMAND, BEFORE ANYTHING ELSE: `remove longsword`. This is not
    optional and it is not cosmetic. A 2026-09-21 run lost most of its
    sample because an armed witness auto-retaliated and killed the Arena
    Champion, the Sparring Partner and both Training Dummies within a
    minute each, and a corpse then SHADOWS the respawned mob of the same
    name, so every later `kick <name>` answered "You don't see them here."
    Disarmed you still retaliate, but you do almost no damage and the fight
    lasts.
  - >-
    Then confirm on the party channel that you are in the same room as Sil
    Vantage. Type `look` once and quote the room title, so the report shows
    you could see.
  - >-
    THE MARK RULE, and it governs everything below. Sil will say "MARK 1",
    "MARK 2" and so on, counting up, and will make exactly ONE move after each
    one. Your job is to write down, for every mark you hear, the very next
    line the ROOM is told about that move. Record it as "MARK 7 -> <the exact
    line>". If you hear two marks with no move line between them, or one mark
    with two move lines under it, say so and discard that mark rather than
    guessing which line belongs to it.
  - >-
    QUOTE EXACTLY. The room's lines name Sil and the target, like "Sil Vantage
    kicks Training Dummy!" or "Sil Vantage's kick sends Sparring Partner
    sprawling!". Copy them character for character. Do not shorten a name, do
    not fix the punctuation, do not merge two lines into one. If a line has no
    exclamation mark, write it without one.
  - >-
    FOLLOW, DO NOT LEAD. When Sil goes `south` to the Sparring Ring, follow
    them. When they come back `north`, follow. Never wander off on your own,
    because a mark you cannot see is a lost pair.
  - >-
    THE GRAPPLE LANE. Sil will tell you on the party channel when they are
    holding the Sparring Partner in a grapple. The room lines for a kick from
    inside a grapple should mention the grapple or a knee. Write down which
    marks you were told were grapple marks, and what the room line said for
    each. A room line that talks about a grapple when Sil was standing free,
    or a plain standing line while Sil was clinched, is exactly the defect
    this run is looking for.
  - >-
    THE STOMP LANE. Sil will also trip the Sparring Partner and then kick them
    while they are down. Those room lines should talk about a downed target, a
    boot, a heel. Note which marks those were.
  - >-
    HAND OVER YOUR TABLE. When Sil asks, send them your "MARK n -> line" list
    on the party channel, a few marks at a time so nothing is dropped. Then
    also report the whole table in your own findings.
  - >-
    JUDGE THE WRITING. Report any room line that reads machine-made, any two
    room lines in the same situation that say nearly the same thing, and
    anything that names someone oddly or twice. Quote the exact text of
    anything you flag.
