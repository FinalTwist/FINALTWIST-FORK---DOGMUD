# M3 item 6: the WITNESS. You are Ordel Quist, standing in the Apothecary's
# Hut (room 6456) while Bench Tester works the alchemy bench. You are the
# instrument: STAND STILL AND READ, and quote every line you receive
# VERBATIM, in order. Do not craft anything yourself.
#
# 3 commands per round on the AI port; the overflow is dropped.

ephemeral:
  profile: m2-witness
  start_room: 6456
  budgets:
    wall_clock: 30m

goals:
  - Confirm on the party channel that you are in the same room as Bench Tester, then stand still.
  - >-
    While Bench Tester repeatedly crafts, quote EVERY line you receive,
    unedited and in order, for the whole session. Do not summarize or skip
    anything, including mob idle chatter, room ambiance, or anything that
    looks unrelated.
  - >-
    Specifically watch for and flag immediately if you ever read: a line
    about grinding root to paste, mixing it with water, or sealing a bottle;
    a line about a mixture separating or going cloudy; a healing salve being
    made; a banner of "━" characters with "SKILL ADVANCEMENT" or "STATISTIC
    INCREASED"; or any "grows stronger" / "moment of brilliance" / "learn
    from your mistake" line. None of these belong to you, so reading any of
    them is a defect and should be reported as one, quoted verbatim.
  - >-
    When Bench Tester asks you on the party channel whether you read
    anything about their crafting, answer them honestly and verbatim based
    on what you actually saw (or did not see).
  - Judge every line you read as writing. Quote anything awkward or odd.
