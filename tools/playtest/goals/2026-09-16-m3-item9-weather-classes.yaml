# M3 item 9 gate: the three weather prose classes, verified in play.
#
# What this is checking. Weather ambient emotes used to have two classes,
# outdoor and indoor, and every indoor room drew from one pool written for a
# BUILT STRUCTURE: roofs, eaves, windowpanes, shutters, floorboards. But 124 of
# the game's 161 indoor rooms are underground (123 cave, 1 dungeon), so every
# cave in the game was being told about rain drumming on a roof it does not
# have.
#
# There is now a third class, `underground`, and cave/dungeon rooms read it.
# Unit tests and a golden snapshot already prove the resolution logic. What
# only play can show is the LIVE path: a real room, a real biome lookup, and
# the line actually arriving in a client.
#
# Fixture note: pothole_coulee holds BOTH cave rooms (5255 Mine Head) and house
# rooms (5205 The Drowned Lantern), so one spawned front exercises both classes
# with no travel between zones.
#
# Timing note: EmoteEveryRounds is 24 and RoundSeconds is 4, so an ambient line
# arrives roughly every 96 seconds per room, jittered. EmoteStrongChancePct is
# 100, so a front spawned at intensity 1.0 fires on EVERY pass. Be patient
# between lines; this is not a fast-moving test.

# Why the admin profile: this run must spawn a weather front on demand rather
# than wait for the simulation, and `weather spawn` is admin-gated. It is not
# testing the player path; it verifies which prose pool a room resolves to.
# (There is no profile_rationale field. The ephemeral block accepts only
# profile, start_room, overlays, creation_flow, creation_rationale, budgets,
# and unknown keys fail the run closed.)
ephemeral:
  profile: admin
  start_room: 5255
  budgets:
    wall_clock: 30m

goals:
  - >-
    Establish the fixture. You start in room 5255, Mine Head, which is a CAVE.
    Run `weather` to see local conditions, then
    `weather spawn storm pothole_coulee 1.0` to force a storm at full
    intensity over this zone. Confirm the command reports a spawned front.
    Then run `weather` again and confirm the local conditions now show a
    storm.
  - >-
    Collect UNDERGROUND lines. Stay in room 5255 and wait. Roughly every 90
    seconds an ambient weather line will appear on its own; you do not need to
    type anything to trigger it. Wait for at least THREE such lines and record
    each one VERBATIM. While waiting you may `look` occasionally to confirm
    you are still in the cave, but do not leave the room.
  - >-
    Judge the underground lines. Every line you collected must describe
    weather felt through STONE: seepage, dripping, grit shaken loose, pressure,
    mineral cold, a draught down a passage. NONE of them may mention a roof,
    windowpane, shutter, eave, rafter, floorboard, window or door. If any line
    mentions one of those, that is the bug this whole change exists to fix and
    it is the single most important thing to report. Quote it exactly.
  - >-
    Collect SURFACE INDOOR lines for comparison. Travel to room 5205, The
    Drowned Lantern, which is a HOUSE in the same zone and therefore under the
    same storm. Getting there may take several moves; use `look` and the exits
    to navigate, and if you cannot find the way within a few minutes say so
    rather than burning the whole budget. Once there, wait for at least TWO
    ambient lines and record them verbatim.
  - >-
    Judge the indoor lines. These SHOULD sound like a building: roofs, eaves,
    shutters, windows and floorboards are all correct here. That vocabulary is
    right in a house and wrong in a cave, which is the entire point of the
    split. Report whether the two sets of lines are clearly distinguishable
    from each other.
  - >-
    Report anything that reads badly regardless of which pool it came from: a
    line that narrates the weather OUTSIDE rather than what is felt in the
    room, a line that tells you that you moved or did something when you were
    standing still, a line that asserts a span of time you did not experience
    (overnight, all afternoon), or a line that repeats within your sample.
