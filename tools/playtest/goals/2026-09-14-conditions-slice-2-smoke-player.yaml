# Conditions unification slice 2 smoke test, PLAYER half. The slice renamed
# buffs to conditions in code, help and messages, and must change nothing
# about how the game plays. You are a weak early character in the Ironwind
# Steppe, where hostile steppe wolves bleed you. Quote lines VERBATIM.
# 3 commands per round on the AI port; the overflow is dropped.
ephemeral:
  profile: early
  start_room: 3015
  budgets:
    wall_clock: 20m

goals:
  - >-
    Type `conditions` before any fight and quote the output.
  - >-
    Let the wolves attack you (plain `attack` only). Once you read
    "Blood seeps from your wounds!", type `conditions` and quote the
    Bleeding row (expect "Bleeding" or "Bleeding (2)"). Rest out of combat
    below a third of health.
  - >-
    Type `help rally`, `help warcry`, `help iron-will` and `help conditions`.
    Quote any line that says "buff" or "debuff" (none are expected), any line
    that reads oddly, and any template error text.
  - >-
    Type `help buff` and `help setcondition` and report what you see (as a
    non-admin you may be refused or shown the admin page; just report it).
    Type `buff list` and `setcondition list`: both must be refused as unknown
    or not allowed for a player.
  - >-
    Judge every line as writing. Quote raw numbers, a literal "{source}",
    template errors such as "can't evaluate field", or duplicated lines.
