role: user
username: template-counters
character:
  name: Counter Bait
  description: >
    Synthetic profile for the counters-slice playtest. A weak attacker with
    one of every SWING attack type (a special move, a sling, a single
    physical working, a mental working, an area working), seeded in the
    Rift Chamber so Sable can start an arena fight at high gold. Charisma is
    raised well past the other stats not to attack with, but purely to fund
    a deep conviction pool: kinetic-hurl, mind-spike and sparks all roll
    willpower for their own defence, so willpower stays at 30 to keep those
    three workings crittable, and conviction capacity has to come from
    charisma instead. This profile never taunts or charms; that half of the
    fixture is `counters-words`. The opponent's defences should crit often
    against these stats; that is the point.
  roomid: 5000
  zone: Thornwall City
  speciesid: 1
  stats:
    strength:
      base: 30
    dexterity:
      base: 30
    perception:
      base: 30
    vitality:
      base: 400
    willpower:
      base: 30
    charisma:
      base: 260
  health: 1235
  stamina: 1235
  conviction: 815
  gold: 30000
  skills:
    weapon-combat: 3
    unarmed-combat: 3
    ranged-combat: 3
    spellcasting: 3
    rhetoric: 3
  spellbook:
    kinetic-hurl: 1
    mind-spike: 1
    sparks: 1
  items:
  - itemid: 30064
  - itemid: 30064
  equipment:
    weapon:
      itemid: 10038
