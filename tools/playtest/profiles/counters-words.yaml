character:
  name: Word Bait
  description: >
    Synthetic profile for the counters-slice playtest, WORDS half. A weak
    attacker with the two social attack types (taunt and charm), seeded in
    the Rift Chamber so Sable can start an arena fight at high gold. Both
    lanes roll charisma for their own defence, so charisma stays at 30 to
    keep taunt and charm crittable, and willpower is raised well past the
    other stats not to attack with, but purely to fund a deep conviction
    pool. This profile never kicks, shoots or casts kinetic-hurl,
    mind-spike or sparks; that half of the fixture is `counters`. The
    opponent's defences should crit often against these stats; that is the
    point.
