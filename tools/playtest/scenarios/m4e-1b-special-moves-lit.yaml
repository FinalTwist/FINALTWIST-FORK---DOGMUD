# M4e PR 1b: the twelve player special-move files now read their wording from
# internal/movenarration, and the three audiences are paired BY INDEX. Variant
# N of actor, actee and observer must describe the SAME moment. Before the
# migration each role drew its own independent variant, so the attacker could
# read one thing while the room read another.
#
# The byte-identity net (305/305) already proves the WORDING. What it cannot
# see is whether the paired lines agree, which is what this scenario reads.
#
# WHY THE TEST ARENA: rooms 201/202/204 are biome `fort`, and
# _datafiles/world/dogmud/biomes/fort.yaml ships `litarea: true` /
# `darkarea: false`, so GetVisibility() returns 2 day and night. Darkness
# would hide names and whole lines and mask exactly the coherence under test.
# The roster starts in room 204 with the Arena Champion (mob 61, stats 150,
# armour and buckler, 5 real minute respawn), the most durable opponent in the
# zone; room 202's Sparring Partner (mob 60, human, stats ~115) is the second
# lane and the only target with the anatomy for trip and grapple.
#
# 🪤 BOTH CHARACTERS DISARM FIRST, and the goals files say so as their first
# instruction. A 2026-09-21 run lost most of its sample because the armed
# witness auto-retaliated and killed every opponent in under a minute, and a
# corpse SHADOWS the respawned mob of the same name (a known standing bug), so
# every later `kick <name>` answered "You don't see them here". For the same
# reason the actor always NAMES its target; a bare `kick` answers "Kick whom?"
# whenever the actor is not already in combat.
#
# WHAT IS NOT HERE, and why. Verified from source 2026-09-21:
#   - gore/maul/rake/pounce/throttle are gated on `!HasBodyPart("hands")` plus
#     a species natural attack (internal/actions/combat_{gore,maul,rake,
#     pounce,throttle}.go); drain is gated on species LifeDrain. Every shipped
#     playtest profile is speciesid 1 (human), and a new profile cannot be
#     added without an entry in playtestprofiles.KnownTemplateIDs, which is Go.
#     Those six verbs are therefore unreachable from this fixture.
#   - the ACTEE role needs a player target. GamePlay.PVP ships `disabled` and
#     playtestrun.rejectPvPRequires refuses `requires.pvp` outright, so the
#     actee line is not observable in play and rests on the byte-identity net.
name: m4e-1b-special-moves-lit
mode: party
summary: >-
  An actor works kick through all three of its sub-movesets, plus bash, trip
  and grapple, on lit ground while a witness reads exactly what the room is
  told, so each actor line can be set beside the room line for the same
  moment.
on_actor_stop: continue
budgets:
  wall_clock: 35m
requires:
  max_connections: 20
roster:
  - id: actor
    personality: bug-finder
    goals: goals/scenarios/m4e-1b-special-moves-lit/actor.yaml
  - id: witness
    personality: bug-finder
    goals: goals/scenarios/m4e-1b-special-moves-lit/witness.yaml

group_goals:
  - id: mark-then-move
    do: >-
      The actor says `say MARK <n>` with a rising number, and ONLY THEN uses
      one special move. Never two moves under one mark. The witness records
      the mark it just read and the next room line that follows it.
    verify: >-
      Every mark number appears in both transcripts with exactly one move
      line under it. A mark with no room line, or two room lines, means the
      pairing is unreadable and the mark is discarded rather than guessed.
  - id: same-moment
    do: >-
      For every mark, set the actor's own line beside the room's line.
    verify: >-
      They must describe ONE moment. A hit beside a miss, a knockdown beside
      a plain hit, a knee beside a stomp, or a grapple line beside a standing
      line is the defect this scenario exists to find. Differences of WORDING
      for the same moment are fine and expected; differences of EVENT are not.
  - id: sub-movesets
    do: >-
      Reach all three kick forms. A plain `kick` is the standard form. `trip`
      the Sparring Partner first and then `kick` for the STOMP form. `grapple`
      the Sparring Partner first and then `kick` for the KNEE form.
    verify: >-
      A stomp line must read as a stomp to BOTH readers, a knee line as a knee
      to both. A room line that says "in the grapple" while the actor's line
      says nothing about a clinch, or the reverse, is a finding.
  - id: reads-well
    do: Judge every line as prose beside the other lines in its pool.
    verify: >-
      Report anything that repeats a sibling almost word for word, reads
      machine-made, or names someone oddly. Two adjacent variants that say
      nearly the same thing are worth quoting.
