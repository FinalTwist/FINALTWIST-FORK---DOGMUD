# Conditions unification, slice 1b: the mechanics the owner ruled on.
#
# Two players in two places, sharing one world:
#   - a BLEEDER in the Ironwind Steppe (room 3015), where hostile steppe wolves
#     hamstring. Bleeds now STACK: each landed hit is its own wound with its
#     own timer, the list shows "Bleeding (N)", one bleed line per round, and
#     the bleeding carries on after the fight.
#   - a CASTER in the Rift Chamber (room 5000) who buys an arena fight, casts
#     blood-boil (the spell poison now lands every round), gets knocked down if
#     the arena mob does it, and dies once so the Respawn Grace record can be
#     checked: secret records show in neither `conditions` nor the client.
name: conditions-slice-1b
mode: party
summary: >-
  A bleeder lets a wolf pack wear them down to watch bleed stacks rise, settle
  and outlast the fight; a caster poisons an arena mob, reads the recovery
  round, and checks that a secret record stays hidden after a death.
on_actor_stop: continue
budgets:
  wall_clock: 35m
requires:
  max_connections: 20
roster:
  - id: bleeder
    personality: bug-finder
    goals: goals/scenarios/conditions-slice-1b/bleeder.yaml
  - id: caster
    personality: bug-finder
    goals: goals/scenarios/conditions-slice-1b/caster.yaml

group_goals:
  - id: bleed-stacks
    do: >-
      Bleeder stays among the steppe wolves, fights without finishing them
      quickly, and types `conditions` every few rounds.
    verify: >-
      The Bleeding row reads "Bleeding (2)" or "Bleeding (3)" at some point.
      "Blood seeps from your wounds!" arrives at most once per round, never
      several times in one round. No raw numbers anywhere.
  - id: bleed-outlasts-the-fight
    do: >-
      Bleeder ends the fight (kill or leave), then waits and types
      `conditions` until the bleeding stops.
    verify: >-
      Bleeding continues for some rounds after combat ends, then "Your wounds
      stop bleeding." arrives once. A bleed that stops the moment combat ends,
      or never stops, is the defect.
  - id: poison-every-round
    do: >-
      Caster types `ask sable arena 350`, casts `blood-boil` at the arena mob,
      and watches the mob for several rounds.
    verify: >-
      The cast narrates an affliction. The caster reads no poison line meant
      for the mob's own client. Report how the fight went.
  - id: recovery-round
    do: >-
      If the arena mob knocks the caster down, the caster reports the stand or
      slip lines and how many of their own attack lines came in that round.
    verify: >-
      While still on the ground, each weapon attacks at most once per round.
      Report if no knockdown happened.
  - id: secret-stays-hidden
    do: >-
      Caster dies once (the arena is fine), then types `conditions` right after
      respawning.
    verify: >-
      No "Respawn Grace" row and no "Mysterious Affliction" row. Either one
      showing is the defect.
  - id: reads-well
    do: Judge every line seen as prose.
    verify: Report anything that repeats, reads machine-made, or shows a raw number.
