# Spell effects parity slice 3b: one applier per helpful effect (condition,
# heal, shield, purge) whoever casts and whoever is helped; help spells are
# uncontested everywhere; one area-help filler. A player's area heal lands
# on the players in the room and on creatures charmed by the caster or a
# party member, never on a stranger's pet; an uncharmed creature's area help
# lands on its packmates. A player's harmful condition spell on a mob is an
# assault (SeedAggression), so a hex on a townsperson is a crime.
#
# Fixtures (verified against YAML 2026-09-28, branch head 044bda22f):
#   462 Main Street, Central, Thornwall (spawns Street Performer 101).
#     Thornwall Thug 105 (hostile) spawns in Back Alley, West (474):
#     west then south from 462 (or south then west).
#   486 Drainage Junction (south, south, west, down, down from 462) spawns
#     Tunnel Rat Swarm 244 (hostile, not charm_immune): the stranger's pet.
#   460 Gate Ward: City Guard 106 and Thornwall Crossbowman 378. City
#     Beggar 100 spawns in 461 (Main Street, West) next door east.
#     Crimes persist per faction at <DataFiles>/factions.crimes/<id>.yaml.
#   4052 Bandit Camp, North Road: Bandit Fighter 284, Bandit Caster 285
#     (spellbook mend-wounds, mind-spike, mind-fog, nerve-disruption) and
#     Soren 286, all routine bandit_camp_guard, so they are packmates.
# No shipped creature casts a heal or shield at a player; the unit tests
# carry that case.
name: spell-effects-3b
mode: party
summary: >-
  A healer and a partner form a party in Thornwall; the healer charms a thug
  as a pet and casts area and single help spells over the party, the pet and
  a stranger who keeps a charmed rat of their own. The stranger then hexes a
  citizen in front of the guards. A fourth caster fights the North Road
  bandits and reads the Bandit Caster's mending lines.
on_actor_stop: continue
budgets:
  wall_clock: 30m
requires:
  max_connections: 20
roster:
  - id: healer
    personality: feature-tester
    goals: goals/scenarios/spell-effects-3b/healer.yaml
  - id: partner
    personality: feature-tester
    goals: goals/scenarios/spell-effects-3b/partner.yaml
  - id: stranger
    personality: feature-tester
    goals: goals/scenarios/spell-effects-3b/stranger.yaml
  - id: mobwatch
    personality: feature-tester
    goals: goals/scenarios/spell-effects-3b/mobwatch.yaml

group_goals:
  - id: party-formed
    do: Healer invites Partner by character name; Partner accepts.
    verify: Both see a two-member party in `party list`.
  - id: pets-charmed
    do: >-
      Healer charms the Thornwall Thug; Stranger charms the Tunnel Rat Swarm;
      both bring their pet back to 462.
    verify: Each pet follows its owner and no longer attacks.
  - id: area-heal-reaches-party-and-own-pet-only
    do: >-
      Healer casts mend-all with Partner, the thug, Stranger and the rat
      swarm in the room.
    verify: >-
      Healer reads "You weave restorative magic around" for Partner, for the
      thug and for Stranger, and one self line; NO such line for the rat
      swarm. Partner reads the healer's Mend All enveloping them.
  - id: pet-shield-and-cleanse
    do: Healer casts conviction-ward on the thug, then cleansing-wave.
    verify: >-
      A shimmering barrier forms around the thug; the cleanse line names
      it; neither says only "takes effect"; the cleanse skips the rat swarm.
  - id: hex-is-assault
    do: Stranger casts mind-fog at a Thornwall citizen with a guard present.
    verify: >-
      The guards react, and the container's
      factions.crimes/thornwall_citizens.yaml gains a kind assault row with
      the stranger as perpetrator.
  - id: mob-healer
    do: Mobwatch fights the Bandit Caster's packmates.
    verify: >-
      The Bandit Caster's mending reads on herself or on a packmate, never
      on the player.
  - id: reads-well
    do: Everyone judges every new spell line as prose.
    verify: No raw numbers, no em dashes, no " -- ", nothing over 80 columns.
