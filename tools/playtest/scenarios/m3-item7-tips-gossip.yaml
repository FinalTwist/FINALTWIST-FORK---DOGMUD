# M3 item 7: the periodic gameplay broadcast is renamed hints to tips
# (internal/tips, hooks.BroadcastTips, every 75 rounds / ~5 minutes,
# prefixed "[Tip] "); the player setting is `set tips` with `set hints`
# kept as an alias; gossiping NPCs (mobs in the `gossiper` group) now read
# lines from internal/gossip instead of hook globals.
#
# Room 4027, Delia's Cottage, Ashwick: Delia (mob 259) is a gossiper with
# no schedule_id conflict here (her schedule keeps her in this room) and,
# unlike the open Dustwalk Road waystation, the cottage has no other
# spawninfo entries, so it is not prone to wandering hostile wildlife. One
# player actor sits with her long enough (~25m) for several tip intervals
# and at least one gossip line, quoting every tip and every gossip line
# verbatim against internal/narration/testdata/stores/tips.golden and
# gossip.golden, and exercising `set tips` / `set hints` / bare `set`.
#
# First attempt used room 405 (Warden's Post, Dustwalk Road, mob 83): a
# wandering Scrubland Dog attacked the actor there and nearly killed them,
# forcing a flee-to-sanctuary mid-run. Switched to this indoor cottage to
# remove that risk for a long stationary observation run.
name: m3-item7-tips-gossip
mode: solo
summary: >-
  A single player waits in Delia's Cottage through several tip intervals
  and any gossip she offers, toggling tips off and back on via its alias,
  and quoting every tip/gossip line verbatim against the golden fixtures.
on_actor_stop: continue
budgets:
  wall_clock: 25m
requires:
  max_connections: 20
roster:
  - id: player
    personality: bug-finder
    goals: goals/scenarios/m3-item7-tips-gossip/player.yaml
