# M3 item 8 adversarial gate: coordinated combat narration.
#
# Item 8 changed how combat narrates a blow. It used to take an INDEPENDENT
# random draw per audience, so one sword stroke could be a laceration to the
# attacker, a devastating hit to the defender and a critical strike to the
# room. It now renders every audience from a single coordinated index.
#
# The slice also authored 984 new lines across all 20 weapon files and
# reordered 402 groups so that entry N of each role describes the same moment.
# Automated checks proved the pools are equal, that nothing was deleted or
# edited, and that the golden holds every line exactly once. NONE of them can
# tell you whether the three viewpoints actually read as one event, because
# "describes the same moment" is not machine-checkable. That is this run's job.
#
# TWO ACTORS, and the second one is the point. The attacker sees only their own
# line. A mob receives the defender line and cannot report it. Only a real
# player standing in the room can tell you what the room was told, so the
# witness is the instrument.
#
# Both are seeded on the Pothole Coulee range, which is the one fixture built
# for shooting across a room boundary. That matters: the cross-room case is the
# only one with FOUR audiences, and shooting.yaml's two defender-room pools
# were authored from nothing in this slice, so they have never been seen in
# play by anyone.
name: m3-item8-coordinated-combat
mode: party
summary: >-
  An archer fights at range and unarmed while a plain witness stands in the
  room, or in the target's room, and reports line by line what they were told.
  Every lane compares the two viewpoints of the SAME blow.
on_actor_stop: continue
budgets:
  wall_clock: 45m
requires:
  max_connections: 20
roster:
  - id: archer
    personality: bug-finder
    goals: goals/scenarios/m3-item8-coordinated-combat/archer.yaml
  - id: witness
    personality: bug-finder
    goals: goals/scenarios/m3-item8-coordinated-combat/witness.yaml

group_goals:
  - id: same-room-shot-agrees
    do: >-
      Archer shoots something in the SAME room, several rounds, while witness
      stands there doing nothing. After each round both quote their line
      verbatim on the party channel.
    verify: >-
      For each round the two lines describe ONE event. If the archer says the
      shot went wide and the witness says it punched through, that is the exact
      defect this slice removed and it has come back. Judge the pairing round
      by round, not on the whole fight.
  - id: cross-room-shot-has-four-audiences
    do: >-
      Archer stands one room away from the target and shoots across the
      boundary. Run it twice: once with witness beside the ARCHER, once with
      witness beside the TARGET.
    verify: >-
      Beside the archer, the witness is told about someone loosing a shot
      through an exit. Beside the target, the witness is told about a shot
      arriving from an exit. These are DIFFERENT lines for different rooms and
      both must name a plausible direction. Silence in the target's room is a
      finding: those lines were authored in this slice and had no predecessor.
  - id: prepare-and-wait-across-rooms
    do: >-
      Catch the opening rounds of a cross-room fight, before any hit lands,
      with witness beside the TARGET.
    verify: >-
      The target's room is told something while the archer is still taking aim.
      This is the newest text in the whole slice, eighteen lines that replaced
      an explicit nothing, so it is the most likely place for an awkward or
      missing line.
  - id: unarmed-melee-agrees
    do: >-
      Archer punches something in melee for several rounds with witness in the
      room. Same verbatim comparison per round.
    verify: >-
      Same-moment agreement, and the lines must read as fists rather than as a
      weapon. Sixty-three lines were added to the unarmed pool.
  - id: no-token-or-blank-leaks
    do: >-
      Across every lane, watch for literal curly-brace tokens, a doubled name,
      a sentence that starts lowercase, or an EMPTY combat line.
    verify: >-
      Any of these is a finding. A blank line where a blow should be described
      is the specific failure mode of the new renderer: it returns nothing at
      all rather than a wrong line when it cannot coordinate.
  - id: reads-well
    do: >-
      Judge the new lines as prose, not as evidence. Fight long enough to see
      repeats.
    verify: >-
      Report any line that reads oddly for the weapon, repeats awkwardly within
      a single fight, or crowds a busy round. Most of these lines have never
      been read by a human.
